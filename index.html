<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andhara's Digital Space | Andhara Dila Manggala Putri</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff5f7 0%, #fef9c3 48%, #e0f2fe 100%);
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 48px;
            position: relative;
            overflow-x: hidden;
        }

        /* Dekorasi Cahaya Warna-Warni Latar Belakang */
        .blob-1 {
            position: fixed;
            top: -90px;
            left: -90px;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.35) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .blob-2 {
            position: fixed;
            bottom: -110px;
            right: -70px;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .blob-3 {
            position: fixed;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(250, 204, 21, 0.25) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .wrapper {
            width: 100%;
            max-width: 900px;
            z-index: 1;
        }

        /* --- FLOATING TOP NAVBAR --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border: 2px solid #ffffff;
            border-radius: 50px;
            padding: 10px 22px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.06);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            color: #0f172a;
            text-decoration: none;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #f59e0b);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            transition: color 0.25s ease;
        }

        .nav-links a:hover {
            color: #db2777;
        }

        .nav-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fdf2f8;
            border: 1px solid #fbcfe8;
            color: #db2777;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 50px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #ec4899;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.25); }
        }

        /* --- HERO SECTION --- */
        .hero-card {
            background: rgba(255, 255, 255, 0.82);
            border: 2px solid #ffffff;
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 32px 36px;
            margin-bottom: 28px;
            box-shadow: 0 24px 50px -15px rgba(236, 72, 153, 0.12), 0 12px 28px -10px rgba(0, 0, 0, 0.05);
            display: grid;
            grid-template-columns: 1.35fr 0.85fr;
            gap: 28px;
            align-items: center;
        }

        .greeting-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(90deg, #fce7f3, #fef3c7);
            border: 1px solid #fbcfe8;
            color: #be185d;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 6px 15px;
            border-radius: 50px;
            margin-bottom: 14px;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.35rem;
            font-weight: 700;
            line-height: 1.18;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #be185d 0%, #ea580c 50%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-bio {
            font-size: 0.92rem;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .hero-bio strong {
            color: #1e293b;
            font-weight: 700;
        }

        /* Tag Minat & Fokus */
        .interest-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag-chip {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #334155;
        }

        /* Tombol Aksi Hero */
        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #ec4899 0%, #f59e0b 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.86rem;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 20px -6px rgba(236, 72, 153, 0.45);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 25px -6px rgba(236, 72, 153, 0.55);
        }

        /* Kartu Visual Kanan pada Hero */
        .hero-visual {
            position: relative;
            background: linear-gradient(145deg, #ffe4e6 0%, #fef3c7 52%, #e0f2fe 100%);
            border: 2px solid #ffffff;
            border-radius: 26px;
            padding: 22px 20px;
            text-align: center;
            box-shadow: 0 16px 35px -12px rgba(244, 114, 182, 0.25);
        }

        .avatar-circle {
            width: 98px;
            height: 98px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f43f5e, #fb923c, #38bdf8);
            padding: 4px;
            box-shadow: 0 10px 24px -6px rgba(244, 63, 94, 0.4);
            animation: float 4s ease-in-out infinite;
        }

        .avatar-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: #ffffff;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .visual-role {
            font-size: 0.85rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 3px;
        }

        .visual-campus {
            font-size: 0.75rem;
            color: #475569;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .visual-quote {
            font-size: 0.74rem;
            color: #be185d;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .visual-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: rgba(255, 255, 255, 0.78);
            padding: 8px;
            border-radius: 14px;
            border: 1px solid #ffffff;
        }

        .stat-box span {
            display: block;
            font-size: 1rem;
            font-weight: 800;
            color: #db2777;
        }

        .stat-box small {
            font-size: 0.66rem;
            font-weight: 600;
            color: #64748b;
        }

        /* --- JUDUL SECTION PROYEK --- */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 18px;
            padding: 0 6px;
        }

        .section-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.
